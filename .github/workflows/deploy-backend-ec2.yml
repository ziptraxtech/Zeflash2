name: Deploy Backend to EC2

# The payments API (/create-order) runs on EC2 instances behind
# zeflash-backend-api-347575614.us-east-1.elb.amazonaws.com — confirmed by the
# discovery job in payments-backend.yml, which found no ECS service on that ALB.
#
# This repo has two conflicting ideas of how that box is laid out: this workflow
# assumed ec2-user + docker-compose, backend/deploy.sh assumes ubuntu + PM2.
# Rather than guess, the script below locates the app directory and detects
# whether the service runs under Docker or PM2, then restarts it that way.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose-ec2.yml'
      - 'Dockerfile'
      - '.github/workflows/deploy-backend-ec2.yml'
  workflow_dispatch:

env:
  ALB_DNS: zeflash-backend-api-347575614.us-east-1.elb.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets are set
        env:
          EC2_HOST: ${{ secrets.EC2_BACKEND_HOST }}
          EC2_USER: ${{ secrets.EC2_BACKEND_USER }}
          EC2_KEY: ${{ secrets.EC2_BACKEND_KEY }}
        run: |
          missing=""
          if [ -z "$EC2_HOST" ]; then missing="$missing EC2_BACKEND_HOST"; fi
          if [ -z "$EC2_USER" ]; then missing="$missing EC2_BACKEND_USER"; fi
          if [ -z "$EC2_KEY" ];  then missing="$missing EC2_BACKEND_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — set them in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "All three EC2 secrets are present."

      - name: Open SSH connection
        env:
          EC2_HOST: ${{ secrets.EC2_BACKEND_HOST }}
          EC2_KEY: ${{ secrets.EC2_BACKEND_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$EC2_KEY" > ~/.ssh/deploy-key.pem
          chmod 600 ~/.ssh/deploy-key.pem
          if ! ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "::error::Cannot reach $EC2_HOST on port 22. Check the instance is running and its security group allows SSH from GitHub runners."
            exit 1
          fi
          echo "Host key collected for $EC2_HOST."

      - name: Deploy
        env:
          EC2_HOST: ${{ secrets.EC2_BACKEND_HOST }}
          EC2_USER: ${{ secrets.EC2_BACKEND_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy-key.pem -o BatchMode=yes -o ConnectTimeout=20 \
            "$EC2_USER@$EC2_HOST" 'bash -s' < backend/scripts/ec2-remote-deploy.sh

      - name: Verify the live price table
        run: |
          set -euo pipefail
          echo "Health via load balancer:"
          curl -fsS "http://${ALB_DNS}/health"; echo
          echo ""
          echo "An unknown plan must now be refused rather than silently priced:"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://${ALB_DNS}/create-order" \
            -H 'Content-Type: application/json' -d '{"credits":1,"planName":"definitely-not-a-plan"}')
          echo "  POST /create-order (no auth) -> HTTP $code (401 expected; the auth check runs first)"
          echo ""
          echo "Now confirm in the app: One Time ₹235, Core ₹1,769, Premium ₹2,949." >> "$GITHUB_STEP_SUMMARY"
