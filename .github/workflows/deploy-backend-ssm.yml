name: Deploy Backend via SSM

# The payments API behind the ALB is NOT a Docker container. It is the systemd
# service `zeflash-backend` on the ALB's EC2 target, running `node dist/index.js`
# from the git checkout /home/ubuntu/zeflash/backend on port 3001.
#
# SSM (AmazonSSMManagedInstanceCore on the instance role) runs this as root with
# no SSH key: pull, rebuild dist, restart the service, and put the previous
# build back if the build fails or the service does not come up healthy.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-ssm.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ALB_DNS: zeflash-backend-api-347575614.us-east-1.elb.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the SSM-online instances serving the payments API
        id: targets
        run: |
          set -euo pipefail
          LB_ARN=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?DNSName=='${ALB_DNS}'].LoadBalancerArn" --output text)
          IDS=""
          for TG in $(aws elbv2 describe-target-groups --load-balancer-arn "$LB_ARN" \
                        --query 'TargetGroups[].TargetGroupArn' --output text); do
            IDS="$IDS $(aws elbv2 describe-target-health --target-group-arn "$TG" \
              --query "TargetHealthDescriptions[?starts_with(Target.Id,'i-')].Target.Id" --output text)"
          done
          IDS=$(echo "$IDS" | tr ' \t' '\n\n' | grep -E '^i-' | sort -u | paste -sd, -)
          if [ -z "$IDS" ]; then echo "::error::No EC2 instance targets behind ${ALB_DNS}."; exit 1; fi
          ONLINE=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$IDS" \
            --query 'InstanceInformationList[?PingStatus==`Online`].InstanceId' --output text)
          if [ -z "$ONLINE" ]; then echo "::error::Instances $IDS are not online in SSM."; exit 1; fi
          echo "Deploying to: $ONLINE"
          echo "ids=$ONLINE" >> "$GITHUB_OUTPUT"

      - name: Pull, build and restart
        id: run
        run: |
          set -euo pipefail
          cat > cmd.sh <<'EOF'
          set -e
          cd /home/ubuntu/zeflash
          OLD=$(sudo -u ubuntu git rev-parse HEAD)
          sudo -u ubuntu git fetch -q origin
          sudo -u ubuntu git pull --ff-only -q origin main
          NEW=$(sudo -u ubuntu git rev-parse HEAD)
          echo "==> $OLD -> $NEW"
          cd backend
          rm -rf /tmp/dist.bak && cp -a dist /tmp/dist.bak
          rollback() { echo "==> ROLLING BACK: $1"; rm -rf dist; cp -a /tmp/dist.bak dist; systemctl restart zeflash-backend; exit 1; }
          if ! git diff --quiet "$OLD" "$NEW" -- package.json package-lock.json; then
            sudo -u ubuntu -H npm ci || rollback "npm ci failed"
          fi
          if ! git diff --quiet "$OLD" "$NEW" -- prisma; then
            sudo -u ubuntu -H npx prisma generate || rollback "prisma generate failed"
          fi
          sudo -u ubuntu -H npm run build || rollback "build failed"
          systemctl restart zeflash-backend
          for i in $(seq 1 12); do
            sleep 5
            if curl -fsS localhost:3001/health; then echo; echo "==> healthy at $(git log -1 --format='%h %s')"; exit 0; fi
          done
          rollback "service not healthy after 60s"
          EOF
          jq -Rs '{commands: [.]}' < cmd.sh > params.json
          CMD_ID=$(aws ssm send-command \
            --instance-ids $(echo '${{ steps.targets.outputs.ids }}' | tr '\t' ' ') \
            --document-name AWS-RunShellScript \
            --comment "Zeflash backend deploy ${{ github.sha }}" \
            --timeout-seconds 900 \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)
          echo "cmd=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for it and print the output
        run: |
          set -euo pipefail
          FAILED=0
          for INSTANCE in ${{ steps.targets.outputs.ids }}; do
            echo "=================== $INSTANCE ==================="
            STATUS=Pending
            for i in $(seq 1 90); do
              STATUS=$(aws ssm get-command-invocation --command-id "${{ steps.run.outputs.cmd }}" \
                --instance-id "$INSTANCE" --query 'Status' --output text 2>/dev/null || echo Pending)
              case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
              sleep 10
            done
            echo "--- status: $STATUS"
            aws ssm get-command-invocation --command-id "${{ steps.run.outputs.cmd }}" \
              --instance-id "$INSTANCE" --query '[StandardOutputContent,StandardErrorContent]' --output text || true
            [ "$STATUS" = Success ] || FAILED=1
          done
          exit $FAILED

      - name: Verify through the load balancer
        run: curl -fsS "http://${ALB_DNS}/health"
