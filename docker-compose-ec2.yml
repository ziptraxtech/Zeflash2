version: '3.8'

services:
  zeflash-backend:
    image: 070872471952.dkr.ecr.us-east-1.amazonaws.com/battery-ml:ec2-backend
    container_name: zeflash-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ML_BACKEND_URL=${ML_BACKEND_URL:-http://44.197.181.236:8000}
      - S3_BUCKET=${S3_BUCKET}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - VITE_API_BASE=https://zeflash.vercel.app
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: awslogs
      options:
        awslogs-group: /ec2/zeflash-backend
        awslogs-region: us-east-1
        awslogs-stream-prefix: docker

volumes:
  backend-data:
